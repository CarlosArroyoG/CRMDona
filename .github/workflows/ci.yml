name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    name: Pint, Larastan y Pest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crm_testing
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: crm
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, bcmath, exif, redis
          # Igual que docker/php/app.ini.
          ini-values: date.timezone=America/Mexico_City, intl.default_locale=es_MX, memory_limit=256M
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      # El tema de Filament y la página pública usan los assets de Vite: Pest renderiza
      # pantallas y necesita public/build. Misma versión de Node que el Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest
        run: vendor/bin/pest

  imagen:
    name: Construir imagen de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
